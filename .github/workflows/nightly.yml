name: Nightly

# What the model measures at night (ADR Studio's speed is measured nightly;
# ADR Fitness functions classified as the book does): radical sense run
# --trigger nightly runs the measure of every automated fitness function
# triggered on nightly, each line with its sensor, into radical-metrics/1
# files in reports/metrics. Nothing here names a test or a metric: a fitness
# function added to the model with a sensor radical sense has is run the next
# night. tools/nightly-findings.ts evaluates those fitness functions'
# conditions as radical check does, and each that does not hold (or that
# nothing measured) becomes a finding in crucible/findings/, proposed in a
# bot pull request. The findings go neither into the model nor into Studio.
#
# A condition against a baseline (`<= baseline + 20%`) compares with the
# median of the last seven nights: their measurements are handed on from
# night to night as the artifact nightly-history, outside git.
#
# The worker gives the sensors what they need: the Playwright image (browsers
# and fonts) and the web builds the playwright sensor's specs open.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  measure:
    name: Nightly sensors
    runs-on: ubuntu-latest
    # The same image as the E2E suite (e2e.yml): browsers and fonts.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web && npm run build:hub
      - run: npm run build -w @radicaltools/cli

      - name: What the model measures at night
        # A line that cannot be measured measures nothing: its fitness
        # function's conditions then become findings that say so.
        continue-on-error: true
        run: >-
          node apps/cli/dist/index.js sense run --trigger nightly
          --folder architecture --out reports/metrics
          --context commit=${{ github.sha }}

      - name: Upload what the night measured
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: reports/
          retention-days: 30

  findings:
    name: Nightly findings
    needs: measure
    if: ${{ !cancelled() }}
    # Off the container: gh is on the runner.
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The bot pull request is pushed and opened with this token (ADR
          # Studio's speed is measured nightly): GitHub Actions' own token may
          # not open pull requests here, and one opened with it would not
          # start the checks main requires.
          token: ${{ secrets.NIGHTLY_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @radicaltools/cli
      - uses: actions/download-artifact@v4
        with:
          name: nightly-reports
          path: reports

      - name: Earlier nights
        # The last seven nights' measurements, from the latest earlier run
        # that kept them.
        run: |
          mkdir -p history
          for run in $(gh run list --workflow nightly.yml --branch main --limit 10 --json databaseId,status -q '.[] | select(.status == "completed") | .databaseId'); do
            [ "$run" = "${{ github.run_id }}" ] && continue
            if gh run download "$run" --name nightly-history --dir history 2>/dev/null; then echo "From run $run:"; break; fi
          done
          ls history

      - name: Check
        # What the conditions say, for the run's log; the findings come from
        # the next step.
        run: |
          baseline=""
          if ls history/*.json >/dev/null 2>&1; then baseline="--baseline history"; fi
          node apps/cli/dist/index.js check architecture --metrics reports/metrics $baseline --format github || true
      - name: Findings
        run: |
          baseline=""
          if ls history/*.json >/dev/null 2>&1; then baseline="--baseline history"; fi
          npx tsx tools/nightly-findings.ts architecture crucible/findings \
            --metrics reports/metrics $baseline --trigger nightly \
            --commit ${{ github.sha }} \
            --run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} \
            | tee nightly-findings.txt

      - name: Hand on the last seven nights
        # Tonight's measurements join the history (<night>_<file>.json), which
        # keeps the seven latest nights; a night that measured nothing adds
        # nothing. Before the findings are proposed, so a night whose pull
        # request fails counts.
        run: |
          night="$(date -u +%Y-%m-%dT%H%M)-${{ github.run_id }}"
          for f in reports/metrics/*.json; do [ -f "$f" ] && cp "$f" "history/${night}_$(basename "$f")"; done
          ls history | sed 's/_.*//; s/\.json$//' | sort -u | head -n -7 | while read -r old; do rm -f "history/${old}"_* "history/${old}.json"; done
          ls history
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-history
          path: history/
          if-no-files-found: ignore
          retention-days: 90

      - name: Propose the findings
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain crucible/findings)" ]; then echo "No new findings."; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then echo "::error::No secret NIGHTLY_TOKEN: the findings are not proposed (see the ADR Studio's speed is measured nightly)."; exit 1; fi
          branch="bot/nightly-findings-$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add crucible/findings
          git commit -m "Nightly findings $(date -u +%Y-%m-%d)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Nightly findings $(date -u +%Y-%m-%d)" \
            --body "The nightly sensors broke conditions of the model (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Each finding is a file in crucible/findings/; merged, it starts the next change: a fix, or a decision that the condition is wrong."
