name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to validate or publish'
        type: choice
        required: true
        default: mcp
        options:
          - cli
          - mcp
      dry-run:
        description: 'Validate and upload the package without publishing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - name: Publish only from main
        if: ${{ !inputs.dry-run && github.ref != 'refs/heads/main' }}
        run: |
          echo '::error::Publish npm releases from main after the pull request is merged.'
          exit 1
      - name: Validate the package selection
        run: |
          case "$PACKAGE" in
            cli|mcp) ;;
            *) echo '::error::Select cli or mcp.'; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - run: npm run check:workspaces
      - run: npm run typecheck
      - run: npm test
      - name: Verify the installable tarball
        run: npm run test:package -w "@radicaltools/$PACKAGE" -- --out-dir ../../release
      - uses: actions/upload-artifact@v4
        with:
          name: radical-tools-${{ inputs.package }}-npm
          path: release/radicaltools-${{ inputs.package }}-*.tgz
          if-no-files-found: error
      - name: Check the publish command without releasing
        if: ${{ inputs.dry-run }}
        run: npm publish ./release/radicaltools-"$PACKAGE"-*.tgz --access public --provenance --dry-run
      - name: Publish the verified tarball with OIDC
        if: ${{ !inputs.dry-run }}
        run: npm publish ./release/radicaltools-"$PACKAGE"-*.tgz --access public --provenance
