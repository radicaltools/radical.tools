name: Release Desktop App

# Triggers:
#   • Push a tag matching "v*" (e.g. npm version 1.1.0 && git push --follow-tags)
#     → builds macOS / Windows / Linux installers and drafts a GitHub Release
#   • Pull requests touching packaging → builds only, to catch breakage early
#   • Manual run from the GitHub UI → builds only; installers land in the run's artifacts
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - apps/studio/electron-builder.yml
      - apps/studio/package.json
      - .github/workflows/release.yml
      - apps/studio/build/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Quality gate ──────────────────────────────────────────────────────────
  verify:
    name: Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./apps/studio/package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

  # ── Installers (one runner per OS; targets come from electron-builder.yml) ─
  build:
    name: Build (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build installers
        run: npm run dist
        env:
          # Unsigned builds for now — see README "Install" for the Gatekeeper /
          # SmartScreen workaround. Add CSC_LINK / APPLE_ID secrets to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/studio/dist/*.dmg
            apps/studio/dist/*.exe
            apps/studio/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # ── Draft release (tags only) — review the notes, then click Publish ─────
  release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "radical.studio $GITHUB_REF_NAME" \
            --generate-notes \
            --draft
