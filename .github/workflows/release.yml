name: Release Desktop App

# Triggers:
#   • Push a tag matching "v*" (npm run release:tag on main, then git push origin v<version>)
#     → builds macOS / Windows / Linux installers and drafts a GitHub Release
#       with the version's changelog section
#   • Pull requests touching packaging → builds only, to catch breakage early
#   • Manual run from the GitHub UI → builds only; installers land in the run's artifacts
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - apps/studio/electron-builder.yml
      - apps/studio/package.json
      - .github/workflows/release.yml
      - apps/studio/build/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Quality gate ──────────────────────────────────────────────────────────
  verify:
    name: Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # One product version: the CLI, the MCP server, the Desktop app and the
      # VS Code extension all carry the tag's, and the changelog has its section.
      - name: Tag matches the product version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/release.mjs check "$GITHUB_REF_NAME"

  # ── Installers (one runner per OS; targets come from electron-builder.yml) ─
  build:
    name: Build (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build installers
        run: npm run dist
        env:
          # Unsigned builds for now — see README "Install" for the Gatekeeper /
          # SmartScreen workaround. Add CSC_LINK / APPLE_ID secrets to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # The 0.3.0 installers rebuilt with the new app icon (ADR "One mark
          # for radical.tools"): the code is v0.3.0's, so the build is that
          # release, shown as 0.3.0; its commit stays this branch's.
          RADICAL_TAGS: v0.3.0

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/studio/dist/*.dmg
            apps/studio/dist/*.exe
            apps/studio/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # ── Draft release (tags only) — review the notes, then click Publish ─────
  release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the changelog
        run: node tools/release.mjs notes "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release (v1.0.0-rc.1) is marked as one.
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "radical $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --draft $PRERELEASE
