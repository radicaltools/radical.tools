name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  id-token: write  # Required for OIDC token exchange
  contents: read

jobs:
  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml

  deploy:
    name: Build & Deploy
    needs: e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check workspace boundaries
        run: npm run check:workspaces

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web renderer
        run: npm run build:web
        # Output: apps/studio/out/renderer/index.html + apps/studio/out/renderer/assets/**
        # → studio.radical.tools

      - name: Build Architecture Hub
        run: npm run build:hub
        # Output: apps/hub/out/{index.html,hub-data.json} + apps/hub/out/assets/**
        #         + apps/hub/out/hub/{index.json,<category>/<id>.radical}
        # → hub.radical.tools

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Sync static assets to S3
        run: |
          # Vite content-hashes asset filenames → cache forever (immutable)
          aws s3 sync apps/studio/out/renderer/assets/ \
            s3://${{ secrets.S3_BUCKET }}/assets/ \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Upload index.html (no-cache)
        run: |
          # index.html is the SPA entry point — must never be served stale
          aws s3 cp apps/studio/out/renderer/index.html \
            s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-store"

      - name: Invalidate CloudFront index.html
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html"

      # ── Marketing website (radical.tools + www) ─────────────────────────
      - name: Stamp asset URLs with the build id
        run: |
          # HTML references landing.css / style.css / theme.js as `?v=__BUILD__`.
          # Stamping the commit sha busts browser + CDN caches on every deploy.
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" apps/web/*.html

      - name: Sync marketing website to S3
        run: |
          # Static site under apps/web/ — HTML/CSS/screenshots.
          # HTML is uploaded separately below with no-cache headers.
          aws s3 sync apps/web/ \
            s3://${{ secrets.WEB_S3_BUCKET }}/ \
            --delete \
            --exclude "*.html" \
            --exclude "package.json" \
            --cache-control "public, max-age=3600"

      - name: Upload website HTML (no-cache)
        run: |
          for f in apps/web/*.html; do
            aws s3 cp "$f" \
              "s3://${{ secrets.WEB_S3_BUCKET }}/$(basename "$f")" \
              --cache-control "no-store" \
              --content-type "text/html; charset=utf-8"
          done

      - name: Invalidate CloudFront for marketing site
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.WEB_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/manual.html" "/style.css" "/landing.css" "/theme.js"

      # ── Architecture Hub (hub.radical.tools) ─────────────────────────
      # Built from apps/hub (the viewer runs on Studio's canvas and panels,
      # bundled in). Assets are content-hashed.
      - name: Sync hub assets to S3
        run: |
          aws s3 sync apps/hub/out/assets/ \
            s3://${{ secrets.HUB_S3_BUCKET }}/assets/ \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Upload hub index.html (no-cache)
        run: |
          aws s3 cp apps/hub/out/index.html \
            s3://${{ secrets.HUB_S3_BUCKET }}/index.html \
            --cache-control "no-store" \
            --content-type "text/html; charset=utf-8"

      - name: Sync hub catalogue (no-cache)
        run: |
          # hub/index.json + one .radical (JSON) document per concept.
          # Served as JSON so fetch() content-type checks pass for .radical.
          aws s3 sync apps/hub/out/hub/ \
            s3://${{ secrets.HUB_S3_BUCKET }}/hub/ \
            --delete \
            --cache-control "no-store" \
            --content-type "application/json; charset=utf-8"

      - name: Upload legacy hub-data.json (no-cache)
        run: |
          # Single-file catalogue kept for older desktop builds.
          aws s3 cp apps/hub/out/hub-data.json \
            s3://${{ secrets.HUB_S3_BUCKET }}/hub-data.json \
            --cache-control "no-store" \
            --content-type "application/json; charset=utf-8"

      - name: Remove legacy hub site files
        run: |
          aws s3 rm s3://${{ secrets.HUB_S3_BUCKET }}/hub.js || true
          aws s3 rm s3://${{ secrets.HUB_S3_BUCKET }}/style.css || true

      - name: Invalidate CloudFront for hub
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.HUB_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/hub-data.json" "/hub/*" "/style.css" "/hub.js"
