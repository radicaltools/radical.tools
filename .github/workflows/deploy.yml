name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  id-token: write  # Required for OIDC token exchange
  contents: read

# A tree is checked once (ADR A tree checked once is not checked again). A
# pull request's run of ci.yml checks the tree as it would land and, when
# every job passed, marks it (an artifact named checked-<the tree's hash>).
# Here the job known asks whether main's tree has such a mark. With one, the
# E2E suite, the boundary check, the type-check and the unit tests are left
# out: they passed on this very tree. Without one (a push straight to main, a
# merge after main moved on, a mark expired, the question unanswered) the
# tree is checked whole before it is deployed, as before.

jobs:
  known:
    name: Tree checked before
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To find the mark, an artifact of the run that checked the tree.
      actions: read
    outputs:
      tree: ${{ steps.known.outputs.tree }}
      checked: ${{ steps.known.outputs.checked }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci
      - name: The tree and its mark
        id: known
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/checked.mjs known

  # Left out only for a tree checked before; should the job that asks fail,
  # it runs.
  e2e:
    name: E2E
    needs: known
    if: ${{ !cancelled() && needs.known.outputs.checked != 'true' }}
    uses: ./.github/workflows/e2e.yml

  deploy:
    name: Build & Deploy
    needs: [known, e2e]
    # What passed is deployed: the suite here, or, for a tree checked before,
    # the pull request's run. A failed or cancelled suite deploys nothing.
    if: ${{ !cancelled() && (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && needs.known.outputs.checked == 'true')) }}
    runs-on: ubuntu-latest
    # Deploys queue, one at a time, and are never cancelled halfway: two
    # merges in a row must not upload over each other. A deploy still waiting
    # gives way to a newer one, which deploys the newer main.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The checks, for a tree no pull request's run marked as checked.
      - name: Check workspace boundaries
        if: ${{ needs.known.outputs.checked != 'true' }}
        run: npm run check:workspaces

      - name: Type-check
        if: ${{ needs.known.outputs.checked != 'true' }}
        run: npm run typecheck

      # Radical Assay's Explore tests drive a real Chromium, as the CI job does.
      - name: Install Chromium for the Explore tests
        if: ${{ needs.known.outputs.checked != 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Test
        if: ${{ needs.known.outputs.checked != 'true' }}
        run: npm test

      - name: Build web renderer
        run: npm run build:web
        # Output: apps/studio/out/renderer/index.html + apps/studio/out/renderer/assets/**
        # → studio.radical.tools

      - name: Build Architecture Hub
        run: npm run build:hub
        # Output: apps/hub/out/{index.html,hub-data.json} + apps/hub/out/assets/**
        #         + apps/hub/out/hub/{index.json,<category>/<id>.radical}
        # → hub.radical.tools

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Sync static assets to S3
        run: |
          # Vite content-hashes asset filenames → cache forever (immutable)
          aws s3 sync apps/studio/out/renderer/assets/ \
            s3://${{ secrets.S3_BUCKET }}/assets/ \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Upload index.html (no-cache)
        run: |
          # index.html is the SPA entry point — must never be served stale
          aws s3 cp apps/studio/out/renderer/index.html \
            s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-store"

      - name: Upload the icons
        run: |
          # The mark of radical.tools (tools/brand/radical-mark.svg).
          aws s3 cp apps/studio/out/renderer/favicon.svg s3://${{ secrets.S3_BUCKET }}/favicon.svg \
            --cache-control "public, max-age=3600" --content-type "image/svg+xml"
          aws s3 cp apps/studio/out/renderer/apple-touch-icon.png s3://${{ secrets.S3_BUCKET }}/apple-touch-icon.png \
            --cache-control "public, max-age=3600" --content-type "image/png"

      # One "/*" per distribution: CloudFront bills invalidations per path
      # (1000 free a month, then per path) and a wildcard counts as one, so a
      # deploy costs 3 paths instead of 23. Hashed assets are immutable and
      # come back from S3 once.
      - name: Invalidate CloudFront index.html
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      # ── Marketing website (radical.tools + www) ─────────────────────────
      - name: Stamp asset URLs with the build id
        run: |
          # HTML references landing.css / style.css / theme.js as `?v=__BUILD__`.
          # Stamping the commit sha busts browser + CDN caches on every deploy.
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" apps/web/*.html apps/web/blog/*.html
          # The home page names the released version, the one the CLI carries.
          version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' apps/cli/package.json)
          test -n "$version"
          sed -i "s/__VERSION__/$version/g" apps/web/*.html

      - name: Add the launchers
        run: |
          # radical.tools/radical.sh and /radical.cmd: curl them into a new
          # folder and run setup (apps/cli/launcher).
          cp apps/cli/launcher/radical.sh apps/cli/launcher/radical.cmd apps/web/

      - name: Sync marketing website to S3
        run: |
          # Static site under apps/web/ — HTML/CSS/screenshots.
          # HTML is uploaded separately below with no-cache headers.
          aws s3 sync apps/web/ \
            s3://${{ secrets.WEB_S3_BUCKET }}/ \
            --delete \
            --exclude "*.html" \
            --exclude "package.json" \
            --cache-control "public, max-age=3600"

      - name: Upload website HTML (no-cache)
        run: |
          # Top-level pages and the blog (apps/web/blog/<slug>.html, blog/index.html).
          for f in apps/web/*.html apps/web/blog/*.html; do
            aws s3 cp "$f" \
              "s3://${{ secrets.WEB_S3_BUCKET }}/${f#apps/web/}" \
              --cache-control "no-store" \
              --content-type "text/html; charset=utf-8"
          done

      - name: Invalidate CloudFront for marketing site
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.WEB_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      # ── Architecture Hub (hub.radical.tools) ─────────────────────────
      # Built from apps/hub (the viewer runs on Studio's canvas and panels,
      # bundled in). Assets are content-hashed.
      - name: Sync hub assets to S3
        run: |
          aws s3 sync apps/hub/out/assets/ \
            s3://${{ secrets.HUB_S3_BUCKET }}/assets/ \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Upload hub index.html (no-cache)
        run: |
          aws s3 cp apps/hub/out/index.html \
            s3://${{ secrets.HUB_S3_BUCKET }}/index.html \
            --cache-control "no-store" \
            --content-type "text/html; charset=utf-8"

      - name: Upload hub icons
        run: |
          aws s3 cp apps/hub/out/favicon.svg s3://${{ secrets.HUB_S3_BUCKET }}/favicon.svg \
            --cache-control "public, max-age=3600" --content-type "image/svg+xml"
          aws s3 cp apps/hub/out/apple-touch-icon.png s3://${{ secrets.HUB_S3_BUCKET }}/apple-touch-icon.png \
            --cache-control "public, max-age=3600" --content-type "image/png"

      - name: Sync hub catalogue (no-cache)
        run: |
          # hub/index.json + one .radical (JSON) document per concept.
          # Served as JSON so fetch() content-type checks pass for .radical.
          aws s3 sync apps/hub/out/hub/ \
            s3://${{ secrets.HUB_S3_BUCKET }}/hub/ \
            --delete \
            --cache-control "no-store" \
            --content-type "application/json; charset=utf-8"

      - name: Upload legacy hub-data.json (no-cache)
        run: |
          # Single-file catalogue kept for older desktop builds.
          aws s3 cp apps/hub/out/hub-data.json \
            s3://${{ secrets.HUB_S3_BUCKET }}/hub-data.json \
            --cache-control "no-store" \
            --content-type "application/json; charset=utf-8"

      - name: Remove legacy hub site files
        run: |
          aws s3 rm s3://${{ secrets.HUB_S3_BUCKET }}/hub.js || true
          aws s3 rm s3://${{ secrets.HUB_S3_BUCKET }}/style.css || true

      - name: Invalidate CloudFront for hub
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.HUB_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
