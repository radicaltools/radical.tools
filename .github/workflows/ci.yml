name: CI

# Runs once per pull request into main, on the PR's merge commit (the branch
# as it would land). There is no `push` trigger: on a branch with an open PR
# it ran the same jobs a second time, on the bare branch head. To check a
# branch without a PR, start this workflow by hand (workflow_dispatch).
#
# A tree is checked once (ADR A tree checked once is not checked again): a
# run whose every job passed marks the tree it checked (the gate job ci,
# tools/ci/checked.mjs: an artifact named checked-<the tree's hash>), and
# deploy.yml on main leaves its own E2E suite, type-check and tests out for
# a tree with such a mark. A tree without one is checked whole before every
# deploy.
#
# The "Protect main" ruleset requires the "Type-check & Test" check, and
# main's branch protection also "E2E / E2E (Playwright)", the e2e.yml job that
# merges the shards' reports. The pull_request run reports both.
#
# A pull request run commits the screenshot baselines that changed to the
# branch (job screenshots) and starts this workflow by hand on that commit.
#
# The `skip-e2e` label on a PR skips the E2E job (Type-check & Test still
# runs). Labels are read when a run starts, so add it before pushing, or push
# again; adding a label does not start a run. The E2E suite still runs before
# the deploy from main (deploy.yml): a run that skipped it marks no tree.
#
# Every run step of the checking jobs is `npm ci` or `npm run <script>`, and
# `npm run verify` runs each of those scripts, so a developer runs what CI
# runs (tools/ci/workflows.mjs mirror, fitness function CI runs what verify
# runs). The last job, ci, fails unless every other job succeeded: GitHub
# reports a skipped job as passed.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the PR makes the running checks for the old commit moot.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # actionlint over every workflow, and what the CI/CD pipeline pack asks of
  # them (tools/ci/workflows.mjs: concurrency, one build per deploy, no stored
  # cloud keys, CI steps mirrored by npm run verify).
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:workflows
      - run: npm run check:workflows

  test:
    name: Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:workspaces
      - run: npm run typecheck
      # Radical Assay's Explore tests drive a browser: Playwright's Chromium.
      - run: npm run browsers
      # npm test, keeping a JSON report per workspace for radical check.
      - run: npm run test:reports
      # What the model measures on a pull request: the measure of every
      # automated fitness function triggered on pull-request, into
      # reports/metrics, which the job Architecture model reads. Most name a
      # sensor of .radical/sensors/sensors.json, run once for each
      # element their ADR constrains (Workspace boundaries, One product
      # version, One mark everywhere, Installable npm packages).
      - run: npm run sense:pull-request
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14

  # On a pull request a changed screenshot does not fail the suite: the new
  # baselines are committed to the branch (job screenshots), to review in the
  # PR diff. A run started by hand compares them strictly.
  e2e:
    name: E2E
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-e2e') }}
    uses: ./.github/workflows/e2e.yml
    with:
      update-snapshots: ${{ github.event_name == 'pull_request' }}

  # Commits the screenshots the E2E shards rewrote to the PR branch, then
  # starts this workflow by hand on the new commit: a push made with
  # GITHUB_TOKEN starts no workflow, and the required check has to report on
  # the branch head. That run compares the new baselines strictly. Skipped
  # when the suite failed (the next push regenerates them) or the branch
  # moved on meanwhile (its own run does).
  screenshots:
    name: Commit new screenshot baselines
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/download-artifact@v4
        # No shard wrote one: nothing to download.
        continue-on-error: true
        with:
          pattern: e2e-screenshots-*
          merge-multiple: true
          path: new-baselines
      - name: Commit and re-run the checks
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TESTED: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -d new-baselines ] || [ -z "$(ls -A new-baselines)" ]; then
            echo "Screenshots are up to date."; exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "$TESTED" ]; then
            echo "The branch moved on since this run started; its own run updates the screenshots."; exit 0
          fi
          # One baseline commit per push of someone's: a run that tested the
          # bot's own commit and still sees changed screenshots has a flaky
          # one, and committing it again started a loop (each commit runs
          # this job anew). The strict run after the bot's commit shows it.
          if [ "$(git log -1 --format=%ae "$TESTED")" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
            {
              echo "### Screenshots still change after the bot's own baseline commit"
              echo "Not committed again: a screenshot that differs from run to run is flaky."
              find new-baselines -type f | sed 's/^/    /'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp -R new-baselines/. .
          git add apps/e2e/tests
          if git diff --cached --quiet; then
            echo "Screenshots are up to date."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(e2e): update screenshot baselines"
          git push origin "HEAD:$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
          {
            echo "### Screenshot baselines updated"
            git show --stat --format= HEAD | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

  # The repository's own architecture model (.radical/model/), checked with
  # radical check against this run's test reports: the unit reports of
  # Type-check & Test and, unless the e2e suite was skipped, reports/e2e.json,
  # and what the sensors of Type-check & Test measured (reports/metrics).
  # Its rule settings and baselines are .radical/model/check.json.
  architecture:
    name: Architecture model
    needs: [test, e2e]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports
      # The artifact holds reports/e2e.json (and apps/e2e/playwright-report/),
      # unpacked in place.
      - name: Download the e2e report
        if: ${{ needs.e2e.result == 'success' || needs.e2e.result == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: e2e-report
          path: .
      - name: radical check
        run: npm run check:architecture -- --metrics reports/metrics --format github

  mcp-package:
    name: MCP package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run test:mcp-package

  launcher:
    name: Launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # The launchers run the published CLI: this checks that they find or
    # download Node.js on each platform, not this commit's CLI.
    steps:
      - uses: actions/checkout@v4
      # Linux runs npm with the runner's own Node.js; the launcher itself runs
      # with none on the PATH (tools/ci/launcher.mjs).
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 24
      - name: The launcher finds or downloads Node.js
        run: npm run test:launcher

  # The gate: the check to require on main. It runs whatever happened before
  # it and fails unless every job it needs succeeded (tools/ci/gate.mjs); E2E
  # may be skipped only by the skip-e2e label. Name every other checking job
  # of this workflow in its needs.
  ci:
    name: CI gate
    if: ${{ always() }}
    needs: [workflows, test, e2e, architecture, mcp-package, launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To read this run's artifacts before marking the tree.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci
      - name: Every job succeeded (a skipped or cancelled job is no pass)
        env:
          NEEDS: ${{ toJSON(needs) }}
          MAY_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-e2e') && 'e2e' || '' }}
        run: node tools/ci/gate.mjs
      # The tree every job passed on is marked as checked, so that deploy.yml
      # does not check it again on main. Not when E2E was skipped by the
      # label, and not when the suite wrote new screenshot baselines
      # (checked.mjs reads the run's artifacts): those were not checked whole.
      - name: Mark the tree as checked
        id: mark
        if: ${{ success() && !contains(github.event.pull_request.labels.*.name, 'skip-e2e') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/checked.mjs mark
      - name: Keep the mark
        if: ${{ steps.mark.outputs.name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mark.outputs.name }}
          path: ${{ steps.mark.outputs.file }}
          retention-days: 7
