# Desktop installers — `npm run dist` locally, or push a `v*` tag to let
# .github/workflows/release.yml build every platform and draft a GitHub Release.
appId: com.radical.diagram # must match setAppUserModelId in src/main/index.ts
productName: radical.studio
copyright: Copyright © 2024 radical.tools contributors
artifactName: radical-studio-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build # icon.png (512×512) — node tools/generate-icon.js --size 512 --out build/icon.png
  output: dist

# electron-vite bundles everything into out/; runtime deps come from package.json.
files:
  - out/**
  - package.json

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64]
